database:
  url: postgres://kb:kb@127.0.0.1:5432/kb?sslmode=disable
server:
  listen: "127.0.0.1:8180"
tailscale:
  enabled: false
gitlab:
  token: ""
embedding:
  provider: openai
  model: text-embedding-3-large
  api_key: ""  # set via KB_EMBEDDING_API_KEY env var
workers:
  indexer: 1
  embedder: 1
log:
  level: debug
  format: text
sessions:
  path: /tmp/kb-sessions
  max: 10
agent:
  provider: openai
  api_key: ""  # set via KB_AGENT_API_KEY env var
  max_iterations: 15
  thinking: none
  temperature: 0.3
  max_tokens: 16384
